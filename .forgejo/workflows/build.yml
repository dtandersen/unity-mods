name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  # Anonymous-downloadable dedicated server. Contains the same
  # assembly_valheim / UnityEngine managed DLLs the plugin compiles against.
  VALHEIM_APP_ID: "896660"
  GAME_DIR: /tmp/valheim-server
  BEPINEX_VERSION: 5.4.22
jobs:
  build:
    runs-on: steamcmd
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Cache the whole GAME_DIR (server + BepInEx). Cache hit restores it,
      # then steamcmd below only fetches the delta. Requires cache storage
      # enabled on the Forgejo instance; a miss just means a full download.
      - name: Cache Valheim server + BepInEx
        uses: actions/cache@v4
        with:
          path: /tmp/valheim-server
          key: valheim-server-${{ env.VALHEIM_APP_ID }}-bepinex-${{ env.BEPINEX_VERSION }}-v1
      - name: Download Valheim dedicated server via steamcmd
        run: |
          mkdir -p "$GAME_DIR"
          steamcmd.sh \
            +force_install_dir "$GAME_DIR" \
            +login anonymous \
            +app_update "$VALHEIM_APP_ID" \
            +quit
          echo "=== server layout ==="
          ls "$GAME_DIR"
          echo "=== managed ==="
          ls "$GAME_DIR/valheim_server_Data/Managed" | head -30
      - name: Install BepInEx (compile-time refs only)
        run: |
          if [ -f "$GAME_DIR/BepInEx/core/BepInEx.dll" ]; then
            echo "BepInEx restored from cache, skipping download."
          else
            cd /tmp
            wget -q "https://github.com/BepInEx/BepInEx/releases/download/v${BEPINEX_VERSION}/BepInEx_x64_${BEPINEX_VERSION}.0.zip" -O bepinex.zip
            unzip -q -o bepinex.zip -d "$GAME_DIR"
          fi
          echo "=== bepinex ==="
          ls "$GAME_DIR/BepInEx/core" | head

      # Jotunn is an optional MSBuild reference (valheim.targets picks it up
      # from plugins/ValheimModding-Jotunn), but the code uses it
      # unconditionally — so CI must provide it. Version is derived from
      # manifest.json so the two can't drift apart. Always downloaded: the
      # zip is tiny and this keeps manifest bumps effective despite caching.
      - name: Install Jotunn (compile-time ref only)
        run: |
          JOTUNN_DEP=$(jq -r '.dependencies[] | select(startswith("ValheimModding-Jotunn-"))' OdinsAi.Mod/manifest.json)
          JOTUNN_VERSION=${JOTUNN_DEP#ValheimModding-Jotunn-}
          echo "Jotunn version: $JOTUNN_VERSION"
          rm -rf /tmp/jotunn && mkdir -p /tmp/jotunn
          wget -q "https://thunderstore.io/package/download/ValheimModding/Jotunn/${JOTUNN_VERSION}/" -O /tmp/jotunn/jotunn.zip
          unzip -q -o /tmp/jotunn/jotunn.zip -d /tmp/jotunn
          JOTUNN_DLL=$(find /tmp/jotunn -name Jotunn.dll | head -1)
          mkdir -p "$GAME_DIR/BepInEx/plugins/ValheimModding-Jotunn"
          cp "$JOTUNN_DLL" "$GAME_DIR/BepInEx/plugins/ValheimModding-Jotunn/Jotunn.dll"
          ls "$GAME_DIR/BepInEx/plugins/ValheimModding-Jotunn"
      - name: Test
        run: dotnet test ValheimMods.sln -c Release
      - name: Build mod zip
        run: |
          dotnet build OdinsAi.Mod/OdinsAi.Mod.csproj -c Release \
            -p:DeployOnBuild=false \
            -p:PackageOnBuild=true \
            -p:GamePath="$GAME_DIR"
          echo "=== artifacts ==="
          ls -la OdinsAi.Mod/artifacts/
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: OdinsAi.Mod
          path: OdinsAi.Mod/artifacts/*.zip
          if-no-files-found: error
