name: sage
on:
  push:
    branches: [main]
    paths:
      - 'Stationeers/**'
      - 'Common/**'
      - 'Caev/**'
      - 'Caev.Test/**'
      - 'UnityStubs/**'
      - 'stationeers.targets'
      - 'lib/BepInEx/**'
      - 'global.json'
      - 'local.props.example'
      - '.forgejo/workflows/sage.yml'
  pull_request:
    paths:
      - 'Stationeers/**'
      - 'Common/**'
      - 'Caev/**'
      - 'Caev.Test/**'
      - 'UnityStubs/**'
      - 'stationeers.targets'
      - 'lib/BepInEx/**'
      - 'global.json'
      - 'local.props.example'
      - '.forgejo/workflows/sage.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: steamcmd
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No Stationeers install here: stationeers.targets auto-uses the minimal
      # source stubs (Stationeers/StationeersStubs/) when Assembly-CSharp.dll is absent.
      # This compiles the full solution, including Game/Mod, but game behavior
      # is faked. The shipped zip holds only our DLLs, which resolve against
      # the real game at runtime. Real behavior is only tested locally with
      # the game installed.
      - name: Test Stationeers
        run: dotnet test Stationeers/Sage.sln -c Release -p:DeployOnBuild=false -p:DeployLocalOnBuild=false
      - name: Build Sage mod zip
        run: |
          dotnet build Stationeers/Sage.Mod/Sage.Mod.csproj -c Release \
            -p:DeployOnBuild=false \
            -p:DeployLocalOnBuild=false \
            -p:PackageOnBuild=true
          echo "=== artifacts ==="
          ls -la Stationeers/Sage.Mod/artifacts/
      # Forgejo's own fork: v4 API speaking the protocol Forgejo implements
      # (upstream v4+ hits GHESNotSupportedError against this instance).
      - name: Upload Sage zip
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: Sage.Mod
          path: Stationeers/Sage.Mod/artifacts/*.zip
          if-no-files-found: error
