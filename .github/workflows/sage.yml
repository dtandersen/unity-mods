name: sage

on:
  push:
    paths:
      - 'Stationeers/**'
      - 'Common/**'
      - 'Caev/**'
      - 'Caev.Test/**'
      - 'UnityStubs/**'
      - 'stationeers.targets'
      - 'lib/BepInEx/**'
      - 'global.json'
      - 'local.props.example'
      - '.github/workflows/sage.yml'
  pull_request:
    paths:
      - 'Stationeers/**'
      - 'Common/**'
      - 'Caev/**'
      - 'Caev.Test/**'
      - 'UnityStubs/**'
      - 'stationeers.targets'
      - 'lib/BepInEx/**'
      - 'global.json'
      - 'local.props.example'
      - '.github/workflows/sage.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # No game install on GitHub: stationeers.targets auto-uses the minimal
      # source stubs (Stationeers/StationeersStubs/) when Assembly-CSharp.dll is absent.
      # This compiles the full solution, including Game/Mod, but game behavior
      # is faked. Real behavior is only tested locally with the game installed.
      - run: dotnet build Stationeers/Sage.sln -p:DeployOnBuild=false -p:DeployLocalOnBuild=false
      - run: dotnet test Stationeers/Sage.sln --no-build
      - name: Build mod zip
        run: dotnet build Stationeers/Sage.Mod/Sage.Mod.csproj -c Release -p:DeployOnBuild=false -p:DeployLocalOnBuild=false -p:PackageOnBuild=true
      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: Sage.Mod
          path: Stationeers/Sage.Mod/artifacts/*.zip
          if-no-files-found: error
