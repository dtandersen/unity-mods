name: odins-ai

on:
  push:
    paths:
      - 'Valheim/**'
      - 'UnityStubs/**'
      - 'valheim.targets'
      - 'lib/BepInEx/**'
      - 'lib/Jotunn/**'
      - 'global.json'
      - 'local.props.example'
      - '.github/workflows/odins-ai.yml'
  pull_request:
    paths:
      - 'Valheim/**'
      - 'UnityStubs/**'
      - 'valheim.targets'
      - 'lib/BepInEx/**'
      - 'lib/Jotunn/**'
      - 'global.json'
      - 'local.props.example'
      - '.github/workflows/odins-ai.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # No Valheim install here: valheim.targets auto-uses the minimal source
      # stubs (Valheim/ValheimStubs/) when assembly_valheim.dll is absent.
      # The net48 Mod compiles here but can't execute on Linux; Core/Test are
      # Unity-free and run normally. PackageOnBuild stages a Thunderstore/
      # r2modman zip (manifest.json + plugins/); the DLLs resolve against the
      # real game at runtime.
      - run: dotnet build Valheim/OdinsAi.sln -c Release -p:PackageOnBuild=true
      - run: dotnet test Valheim/OdinsAi.Test/OdinsAi.Test.csproj --no-build -c Release
      - name: Upload zip
        uses: actions/upload-artifact@v6
        with:
          name: OdinsAi.Mod
          path: Valheim/OdinsAi.Mod/artifacts/*.zip
          if-no-files-found: error
